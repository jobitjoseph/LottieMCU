sentence=Minimal-footprint Lottie animation player for microcontrollers (ESP32, RP2040, STM32, SAMD).
paragraph=Plays Lottie/Bodymovin animations converted to a compact binary by the included Python tool. Anti-aliased strip rendering to RGB565 via a callback, so no framebuffer is needed and any display library works. Supports shapes, strokes, gradients, trim paths, repeaters, masks, track mattes and image layers, with optional PSRAM use on ESP32.
